name: Verify V0.2 pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run behavioral checks
        run: python scripts/test_pipeline.py
      - name: Compile example prompts
        run: python scripts/pipeline.py compile examples/library
      - name: Validate example contracts
        run: python scripts/pipeline.py validate examples/library
  render-fixture:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/remotion/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build local test assets
        run: python scripts/make_acting_fixture.py acting-fixture
      - name: Prepare renderer
        run: python scripts/pipeline.py prepare acting-fixture --renderer manga-renderer
      - name: Install renderer dependencies
        working-directory: manga-renderer
        run: npm ci
      - name: Render fixture MP4
        working-directory: manga-renderer
        run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: manga-motion-video-fixture
          path: manga-renderer/out/video.mp4
          if-no-files-found: error
